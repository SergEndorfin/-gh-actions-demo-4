name: 'Deploy to AWS S3'
description: 'Deploy a static website to AWS S3'
inputs:
  bucket-name:
    description: S3 bucket name
    required: true
  bucket-region:
    description: S3 region
    required: false
    default: eu-central-1
  dist-folder:
    description: The folder containing the deployable files.
    required: true
runs:
  using: node24
  main: 'dist/index.js'
